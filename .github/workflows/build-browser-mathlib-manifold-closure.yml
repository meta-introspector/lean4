name: Build browser Mathlib manifold closure

# This is not a full Mathlib build. It packages the transitive dependency
# closure rooted at Mathlib.Geometry.Manifold.IsManifold.Basic for wasm32 Lean.
#
# The regular Web Assembly and Linux 32bit jobs stay unchanged. This manually
# dispatched sidecar consumes both artifacts from one completed CI run:
#   * Web Assembly supplies the browser runtime and authoritative core oleans.
#   * Linux 32bit supplies native-speed Lean/Lake with the same pointer width.
on:
  workflow_dispatch:
    inputs:
      toolchain_run_id:
        description: 'CI run id containing matching build-Web Assembly and build-Linux 32bit artifacts'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact Lean fork revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install i386 runtime and build libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libc6:i386 libstdc++6:i386 zlib1g:i386 libuv1:i386 \
            gcc-multilib g++-multilib zstd

      - name: Resolve and verify locked revisions
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_RUN_ID: ${{ inputs.toolchain_run_id }}
        run: |
          LOCK=.github/browser-mathlib-manifold-closure.lock.json
          WORKFLOW_COMMIT=$(git rev-parse HEAD)
          LEAN_UPSTREAM_COMMIT=$(jq -r '.lean.upstreamCommit' "$LOCK")
          LEAN_TOOLCHAIN=$(jq -r '.lean.toolchain' "$LOCK")
          MATHLIB_REPOSITORY=$(jq -r '.mathlib.repository' "$LOCK")
          MATHLIB_COMMIT=$(jq -r '.mathlib.commit' "$LOCK")
          ROOT_MODULE=$(jq -r '.mathlib.roots | if length == 1 then .[0] else error("this workflow expects one root module") end' "$LOCK")
          LAYER_ID=$(jq -r '.layerId' "$LOCK")

          RUN_REPOSITORY=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID" --jq '.repository.full_name')
          RUN_COMMIT=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID" --jq '.head_sha')
          test "$RUN_REPOSITORY" = "${{ github.repository }}"

          COMPARE_STATUS=$(gh api \
            "repos/${{ github.repository }}/compare/$LEAN_UPSTREAM_COMMIT...$RUN_COMMIT" \
            --jq '.status')
          [[ "$COMPARE_STATUS" == ahead || "$COMPARE_STATUS" == identical ]]

          # The top-level Lean CI conclusion may be red because an unrelated
          # sentinel or another platform failed. Require the two actual input
          # jobs instead of coupling this sidecar to the entire matrix.
          RUN_JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$TOOLCHAIN_RUN_ID/jobs?per_page=100")
          for JOB_NAME in \
            "build-secondary / Web Assembly" \
            "build-secondary / Linux 32bit"
          do
            jq -e --arg name "$JOB_NAME" \
              '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' \
              <<< "$RUN_JOBS"
          done

          test "$(jq -r '.fullMathlib' "$LOCK")" = false

          echo "LEAN_COMMIT=$RUN_COMMIT" >> "$GITHUB_ENV"
          echo "LEAN_SHORT=${RUN_COMMIT:0:10}" >> "$GITHUB_ENV"
          echo "WORKFLOW_COMMIT=$WORKFLOW_COMMIT" >> "$GITHUB_ENV"
          echo "LEAN_UPSTREAM_COMMIT=$LEAN_UPSTREAM_COMMIT" >> "$GITHUB_ENV"
          echo "LEAN_TOOLCHAIN=$LEAN_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "MATHLIB_REPOSITORY=$MATHLIB_REPOSITORY" >> "$GITHUB_ENV"
          echo "MATHLIB_COMMIT=$MATHLIB_COMMIT" >> "$GITHUB_ENV"
          echo "MATHLIB_SHORT=${MATHLIB_COMMIT:0:10}" >> "$GITHUB_ENV"
          echo "ROOT_MODULE=$ROOT_MODULE" >> "$GITHUB_ENV"
          echo "LAYER_ID=$LAYER_ID" >> "$GITHUB_ENV"
          echo "lean_commit=$RUN_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout exact toolchain source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pins.outputs.lean_commit }}
          path: lean-toolchain-source
          fetch-depth: 1

      - name: Download matching native and browser toolchains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            "${{ inputs.toolchain_run_id }}" \
            -R "${{ github.repository }}" \
            -n "build-Linux 32bit" \
            -D artifacts/linux32
          gh run download \
            "${{ inputs.toolchain_run_id }}" \
            -R "${{ github.repository }}" \
            -n "build-Web Assembly" \
            -D artifacts/wasm32

      - name: Extract and verify toolchains
        run: |
          mkdir -p toolchains/linux32 toolchains/wasm32
          test "$(find artifacts/linux32 -maxdepth 1 -name '*.tar.zst' | wc -l)" -eq 1
          test "$(find artifacts/wasm32 -maxdepth 1 -name '*.tar.zst' | wc -l)" -eq 1
          tar --use-compress-program=unzstd \
            -xf artifacts/linux32/*.tar.zst \
            -C toolchains/linux32 \
            --strip-components=1
          tar --use-compress-program=unzstd \
            -xf artifacts/wasm32/*.tar.zst \
            -C toolchains/wasm32 \
            --strip-components=1

          file toolchains/linux32/bin/lean | tee linux32-lean-file.txt
          grep -q 'ELF 32-bit' linux32-lean-file.txt
          test -f toolchains/wasm32/bin/lean.wasm
          test -f toolchains/wasm32/lib/lean/Init.olean

          # Some i386 runner combinations print the value and then return a
          # non-zero process status, so validate the captured value directly.
          toolchains/linux32/bin/lean --githash > linux32-githash.txt || true
          grep -qx "$LEAN_COMMIT" linux32-githash.txt

          echo "$GITHUB_WORKSPACE/toolchains/linux32/bin" >> "$GITHUB_PATH"

      - name: Checkout pinned Mathlib source
        run: |
          git init mathlib4
          git -C mathlib4 remote add origin "$MATHLIB_REPOSITORY"
          git -C mathlib4 fetch --depth=1 origin "$MATHLIB_COMMIT"
          git -C mathlib4 checkout --detach FETCH_HEAD
          test "$(git -C mathlib4 rev-parse HEAD)" = "$MATHLIB_COMMIT"
          test "$(cat mathlib4/lean-toolchain)" = "$LEAN_TOOLCHAIN"

      - name: Checkout exact Lake dependency revisions
        run: |
          mkdir -p mathlib4/.lake/packages
          while IFS=$'\t' read -r NAME URL REV
          do
            TARGET="mathlib4/.lake/packages/$NAME"
            git init "$TARGET"
            git -C "$TARGET" remote add origin "$URL"
            git -C "$TARGET" fetch --depth=1 origin "$REV"
            git -C "$TARGET" checkout --detach FETCH_HEAD
            test "$(git -C "$TARGET" rev-parse HEAD)" = "$REV"
          done < <(jq -r '.packages[] | [.name, .url, .rev] | @tsv' mathlib4/lake-manifest.json)

      - name: Build the manifold dependency closure with native i386 Lean
        run: |
          cd mathlib4
          lake build "$ROOT_MODULE"

      - name: Package the browser dependency closure
        run: |
          node script/package-browser-library.mjs \
            --workspace "$PWD/mathlib4" \
            --core "$PWD/toolchains/wasm32/lib/lean" \
            --lean-source "$PWD/lean-toolchain-source/src" \
            --output "$PWD/browser-mathlib-manifold-closure/packs" \
            --manifest "$PWD/browser-mathlib-manifold-closure/manifest.json" \
            --root "$ROOT_MODULE" \
            --layer-id "$LAYER_ID" \
            --lean-repository "${{ github.repository }}" \
            --lean-commit "$LEAN_COMMIT" \
            --lean-upstream-commit "$LEAN_UPSTREAM_COMMIT" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --mathlib-repository "$MATHLIB_REPOSITORY" \
            --mathlib-commit "$MATHLIB_COMMIT" \
            --toolchain-run-id "${{ inputs.toolchain_run_id }}"

      - name: Validate and checksum artifact
        run: |
          node -e '
          const fs = require("node:fs")
          const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
          if (manifest.kind !== "mathlib-dependency-closure" || manifest.fullMathlib !== false) {
            throw new Error("artifact is not labelled as a dependency closure")
          }
          if (manifest.lean.commit !== process.argv[2]) throw new Error("Lean pin changed")
          if (manifest.mathlib.commit !== process.argv[3]) throw new Error("Mathlib pin changed")
          if (!manifest.mathlib.roots.includes(process.argv[4])) throw new Error("root module is missing")
          if (!manifest.files.includes(process.argv[4].replaceAll(".", "/") + ".olean")) {
            throw new Error("root module olean is missing")
          }
          if (manifest.packs.length === 0) throw new Error("no artifact packs were produced")
          console.log(`${manifest.packagedModules} modules in ${manifest.packs.length} packs`)
          ' \
            browser-mathlib-manifold-closure/manifest.json \
            "$LEAN_COMMIT" \
            "$MATHLIB_COMMIT" \
            "$ROOT_MODULE"
          cd browser-mathlib-manifold-closure
          sha256sum manifest.json packs/*.pack > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload manifold-specific browser layer
        uses: actions/upload-artifact@v5
        with:
          name: browser-mathlib-manifold-closure-${{ env.LEAN_SHORT }}-${{ env.MATHLIB_SHORT }}
          path: browser-mathlib-manifold-closure
          if-no-files-found: error
          retention-days: 30
