name: Debug import runaway (native i386)
# Probes the 4.33 Init-import memory runaway with the NATIVE i386 stage1 binary
# from a "Linux 32bit" CI run: first a plain run with an address-space cap and
# peak-RSS measurement, then (if it ran away) valgrind massif for the
# allocation tree with symbols. On wasm the same import consumes 4GB in ~1.2s;
# 4.28 does it in <1s within ~hundreds of MB.
on:
  workflow_dispatch:
    inputs:
      toolchain_run_id:
        description: 'CI run id to pull the build-Linux 32bit artifact from'
        required: true
      import_target:
        description: 'Module to import in the probe file'
        required: true
        default: 'Init.Prelude'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install i386 runtime + valgrind
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386 zlib1g:i386 libuv1:i386 zstd valgrind libc6-dbg:i386
      - name: Download toolchain artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.toolchain_run_id }} -R ${{ github.repository }} -n "build-Linux 32bit" -D artifact
      - name: Extract toolchain
        run: |
          tar --use-compress-program=unzstd -xf artifact/*.tar.zst
          TOOLCHAIN=$(echo lean-*-linux_32)
          echo "TOOLCHAIN=$PWD/$TOOLCHAIN" >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/lean" --version
      - name: 'Probe 1: plain run, 3GB address-space cap, peak RSS'
        run: |
          echo "import ${{ inputs.import_target }}" > probe.lean
          export LEAN_PATH="$TOOLCHAIN/lib/lean"
          set +e
          ( ulimit -v 3145728; /usr/bin/time -v "$TOOLCHAIN/bin/lean" probe.lean ) 2>&1 | tail -25
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "NO NATIVE RUNAWAY — import completed within the cap. Bug is Emscripten-specific."
          else
            echo "NATIVE REPRO — import died under a 3GB cap. Massif tree follows."
          fi
          echo "code=$code" >> "$GITHUB_ENV"
      - name: 'Probe 2: valgrind massif allocation tree (only on repro)'
        if: env.code != '0'
        run: |
          export LEAN_PATH="$TOOLCHAIN/lib/lean"
          # Cap the run so massif snapshots the growth phase, not a 6h hang.
          timeout 600 valgrind --tool=massif --threshold=2.0 \
            --massif-out-file=massif.out "$TOOLCHAIN/bin/lean" probe.lean || true
          ms_print massif.out | head -120
      - name: Upload massif data
        if: env.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: massif-out
          path: massif.out
